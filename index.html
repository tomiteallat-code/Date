<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little question 🎟️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #3B1F4A; --bg2: #4E2A60; --ticket: #FFE8A3; --ticket-edge: #F2CF6B;
    --cherry: #E0405E; --cherry-dark: #A82A44; --ink: #2A1633; --muted: #6B5575; --chip: #FFF6D6;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(circle at 20% 10%, var(--bg2), var(--bg) 60%);
    background-color: var(--bg);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }
  .ticket {
    position: relative; width: 100%; max-width: 460px;
    background: var(--ticket); border-radius: 18px;
    padding: 36px 28px 30px;
    box-shadow: 0 18px 0 -8px var(--ticket-edge), 0 30px 60px rgba(0,0,0,.35);
    text-align: center;
  }
  .ticket.pop { animation: arrive .6s cubic-bezier(.2,1.4,.4,1) both; }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; top: 50%; width: 30px; height: 30px;
    background: var(--bg); border-radius: 50%; transform: translateY(-50%);
  }
  .ticket::before { left: -15px; } .ticket::after { right: -15px; }
  @keyframes arrive { from { transform: translateY(40px) rotate(-3deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ticket.pop { animation: none; } }

  h1 {
    font-family: "Caprasimo", Georgia, serif; font-weight: 400;
    font-size: clamp(1.9rem, 7.5vw, 2.5rem); line-height: 1.12; margin: 0 0 14px;
  }
  p { line-height: 1.55; margin: 0 0 18px; }
  .perforation { border-top: 3px dashed var(--ticket-edge); margin: 22px -28px; }

  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  button {
    font: 800 1.05rem "Nunito", system-ui, sans-serif;
    border: 0; border-radius: 999px; padding: 14px 30px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--cherry); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: wait; }
  .yes { background: var(--cherry); color: #fff; box-shadow: 0 5px 0 var(--cherry-dark); transition: transform .1s; }
  .yes:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--cherry-dark); }
  .ghost { background: transparent; color: var(--muted); border: 2px solid var(--muted); }
  .link { background: none; color: var(--muted); padding: 8px; font-weight: 600; text-decoration: underline; }

  #askRow { flex-direction: column; align-items: center; gap: 18px; }

  /* the sad "no" scene */
  #night {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 30%, #1E3A6B, #0E1F3F 55%, #081530);
    transition: opacity 3s ease;
  }
  #rain { position: fixed; inset: 0; z-index: 2; pointer-events: none; width: 100%; height: 100%; }
  #sad {
    position: fixed; left: 50%; top: 50%; z-index: 3; pointer-events: none;
    width: min(72vw, 300px); height: auto;
    transform: translate(-50%, -40%) scale(.9); opacity: 0;
    transition: opacity 1.8s ease, transform 2.2s cubic-bezier(.3,.8,.3,1);
  }
  body.sad #night { opacity: 1; }
  body.sad .ticket {
    opacity: 0; transform: translateY(24px) scale(.96); pointer-events: none;
    transition: opacity 1.8s ease, transform 1.8s ease; animation: none;
  }
  body.sad.face #sad { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  @media (prefers-reduced-motion: reduce) {
    #night, #sad, body.sad .ticket { transition-duration: .8s; }
  }

  .field { text-align: left; margin-bottom: 20px; }
  .field h2 { font: 800 1rem "Nunito", sans-serif; margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--chip); color: var(--ink); border: 2px solid var(--ticket-edge);
    padding: 9px 14px; font-weight: 600; font-size: .95rem;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--ticket); border-color: var(--ink); }
  textarea {
    width: 100%; min-height: 70px; border-radius: 12px; border: 2px solid var(--ticket-edge);
    background: var(--chip); padding: 10px 12px; font: 400 1rem "Nunito", sans-serif; color: var(--ink); resize: vertical;
  }
  textarea:focus-visible { outline: 3px solid var(--cherry); outline-offset: 1px; }
  .hint { color: var(--cherry); font-weight: 700; min-height: 1.4em; margin: 0 0 10px; }

  .summary { text-align: left; background: var(--chip); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
  .summary div { display: flex; justify-content: space-between; gap: 14px; padding: 5px 0; }
  .summary span:first-child { color: var(--muted); }
  .summary span:last-child { font-weight: 800; text-align: right; }
  .admit { font-family: "Caprasimo", Georgia, serif; font-size: 1.4rem; color: var(--cherry); margin: 0 0 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="ticket pop" id="card">

  <!-- 1. The question -->
  <section id="s-ask">
    <h1>Hey, waaant to go on a date? 👉👈</h1>
    <p>Just one question. Choose wisely.</p>
    <div class="perforation"></div>
    <div class="row" id="askRow">
      <button class="yes" id="yesBtn">Yes!</button>
      <button class="ghost" id="noBtn">No</button>
    </div>
  </section>

  <!-- 2. Pick what to do -->
  <section id="s-alt" hidden>
    <h1>Yay! What should we do?</h1>
    <div class="field">
      <h2>What sounds fun?</h2>
      <div class="chips" id="altChips"></div>
    </div>
    <div class="field">
      <h2>Add a note (optional)</h2>
      <textarea id="altNote" placeholder="Ideas, cravings, anything you want me to know"></textarea>
    </div>
    <p class="hint" id="altHint" aria-live="polite"></p>
    <button class="yes" id="altNext">Next: pick a day</button>
  </section>

  <!-- 3. Pick a day -->
  <section id="s-day" hidden>
    <h1>When works for you?</h1>
    <p id="dayIntro">Pick a day that works for you.</p>
    <div class="field">
      <div class="chips" id="dayChips"></div>
    </div>
    <div class="field" id="otherWrap" hidden>
      <h2>When works better for you? (optional)</h2>
      <textarea id="otherWhen" placeholder="e.g. the weekend after, or any evening after 6"></textarea>
    </div>
    <p class="hint" id="dayHint" aria-live="polite"></p>
    <button class="yes" id="sendBtn">Send it</button>
    <br><button class="link" id="dayBack">Back</button>
  </section>

  <!-- 4. Done -->
  <section id="s-done" hidden>
    <p class="admit">Admit two</p>
    <h1>It's a date! 🎉</h1>
    <div class="summary" id="summary"></div>
    <p>Sent! I'll text you soon with the details.</p>
  </section>
</main>

<div id="night" aria-hidden="true"></div>
<canvas id="rain" aria-hidden="true"></canvas>

  let history = [];

  function show(id, remember = true) {
    const current = document.querySelector("main > section:not([hidden])");
    if (remember && current) history.push(current.id);
    document.querySelectorAll("main > section").forEach(s => s.hidden = s.id !== id);
    const card = $("card"); card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function back() { if (history.length) show(history.pop(), false); }

  function makeChips(container, items, onPick) {
    container.innerHTML = "";
    items.forEach(label => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = label; b.setAttribute("aria-pressed", "false");
      b.onclick = () => {
        container.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true"); onPick(label);
      };
      container.appendChild(b);
    });
  }

  // ---- Days I'm free (edit this list to change them) ----
  const DAYS = ["Wed 30 Sep", "Thu 1 Oct", "Sat 3 Oct", "Wed 7 Oct", "Thu 8 Oct", "Fri 9 Oct"];
  const OTHER = "Some other time";
  makeChips($("dayChips"), [...DAYS, OTHER], label => {
    state.day = label; $("dayHint").textContent = "";
    $("otherWrap").hidden = label !== OTHER;
    if (label === OTHER) $("otherWhen").focus();
  });
  makeChips($("altChips"), ALT_OPTIONS, label => { state.plan = label.replace(/^\S+\s/, ""); $("altHint").textContent = ""; });

  // ---- If she says no: night falls, it rains, a sad face appears ----
  const noBtn = $("noBtn");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function startRain() {
    const c = $("rain"), ctx = c.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    function size() { c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    size(); addEventListener("resize", size);
    const target = reduceMotion ? 40 : Math.round(Math.min(160, innerWidth / 6));
    const drops = [];
    const newDrop = (anyY) => ({
      x: Math.random() * (innerWidth + 100) - 50,
      y: anyY ? Math.random() * innerHeight : -30 - Math.random() * 100,
      len: 12 + Math.random() * 16, speed: 5 + Math.random() * 4, alpha: .25 + Math.random() * .35
    });
    let last = performance.now();
    (function frame(now) {
      const dt = Math.min((now - last) / 16.7, 3); last = now;
      if (drops.length < target && Math.random() < .5) drops.push(newDrop(false)); // rain builds up gently
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.lineCap = "round"; ctx.lineWidth = 1.4;
      for (const d of drops) {
        d.y += d.speed * dt; d.x -= d.speed * 0.18 * dt;
        if (d.y > innerHeight + 30) Object.assign(d, newDrop(false));
        ctx.strokeStyle = `rgba(170, 200, 255, ${d.alpha})`;
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.len * 0.18, d.y - d.len); ctx.stroke();
      }
      requestAnimationFrame(frame);
    })(last);
  }

  noBtn.onclick = () => {
    noBtn.disabled = true; $("yesBtn").disabled = true;
    document.body.classList.add("sad");
    setTimeout(startRain, 1200);
    setTimeout(() => document.body.classList.add("face"), 2600);
    // Quietly let you know she said no
    fetch(FORMSPREE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ _subject: "Date invite: she said no", choice: "Said no" })
    }).catch(() => {});
  };

  $("yesBtn").onclick = () => { noBtn.hidden = true; show("s-alt"); };
  $("dayBack").onclick = back;
  $("altNext").onclick = () => {
    if (!state.plan) { $("altHint").textContent = "Pick one option first."; return; }
    state.path = "Said yes"; state.note = $("altNote").value.trim();
    $("dayIntro").textContent = "Pick a day that works for you.";
    show("s-day");
  };

  // ---- Send to Formspree ----
  $("sendBtn").onclick = async () => {
    if (!state.day) { $("dayHint").textContent = "Pick a day first."; return; }
    const otherWhen = $("otherWhen").value.trim();
    const dayText = state.day === OTHER && otherWhen ? `${OTHER}: ${otherWhen}` : state.day;
    const btn = $("sendBtn"); btn.disabled = true; btn.textContent = "Sending…"; $("dayHint").textContent = "";
    const payload = {
      _subject: "She answered your date invite! 🎉",
      choice: state.path, plan: state.plan, day: dayText, note: state.note || "(none)"
    };
    try {
      const res = await fetch(FORMSPREE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Bad response " + res.status);
      const rows = [["Plan", state.plan], ["Day", dayText]];
      if (state.note) rows.push(["Note", state.note]);
      $("summary").innerHTML = "";
      rows.forEach(([k, v]) => {
        const div = document.createElement("div");
        const a = document.createElement("span"); a.textContent = k;
        const b = document.createElement("span"); b.textContent = v;
        div.append(a, b); $("summary").appendChild(div);
      });
      show("s-done");
    } catch (err) {
      $("dayHint").textContent = "That didn't send. Check your connection and tap Send it again.";
    } finally {
      btn.disabled = false; btn.textContent = "Send it";
    }
  };
</script>
</body>
</html>
